packages:
  - "packages/**/*"
  - "tests"
  - "examples/*"
  - "benchmarks/*"
  # The reference client, and the Cardputer app so authoring one uses the
  # repo's toolchain. `clients/cpp` is not a member: native code keeps its own
  # toolchain, which is the whole reason it is a directory and not a package.
  - "clients/js"
  - "clients/cardputer/app"
  - "benchmarks/js-framework-benchmark/frameworks/keyed/backtick"

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false # `pnpm add` writes "^2.16.9", not "workspace:^"
allowBuilds:
  esbuild: true
