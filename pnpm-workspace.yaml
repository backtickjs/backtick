packages:
  # What is published.
  - "packages/*"
  # Built here and never published to npm: a website, an editor extension and
  # the conformance app.
  - "apps/*"
  - "apps/backtickjs.com/*"
  - "tests"
  - "examples/*"
  - "benchmarks/*"
  - "benchmarks/js-framework-benchmark/frameworks/keyed/backtick"

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false # `pnpm add` writes "^2.16.9", not "workspace:^"
allowBuilds:
  esbuild: true
# `bun-types` imports `undici-types` in its declarations without depending on
# it, so it resolved only while pnpm happened to hoist a copy. Declared here so
# the Bun example typechecks whatever else the workspace installs.
packageExtensions:
  bun-types:
    dependencies:
      undici-types: "^7.24.6"
