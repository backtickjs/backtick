packages:
  # What is published.
  - "packages/*"
  # Built here and never published to npm: a website and an editor extension.
  - "apps/*"
  - "apps/backtickjs.com/*"
  - "tests"
  - "examples/*"
  - "benchmarks/*"
  - "conformance"
  - "benchmarks/js-framework-benchmark/frameworks/keyed/backtick"

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false # `pnpm add` writes "^2.16.9", not "workspace:^"
allowBuilds:
  esbuild: true
