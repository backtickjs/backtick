packages:
  # What is published.
  - "packages/*"
  # The projects `create-backtick-app` copies, installed here so they're
  # checked against the packages beside them.
  - "packages/create-backtick-app/templates/*"
  # Built here and never published to npm: an editor extension and the
  # benchmark app.
  - "apps/*"
  - "tests"
  # A stand-in third-party library the tests bind to.
  - "tests/fixtures/*"
  - "examples/*"

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false # `pnpm add` writes "^2.16.9", not "workspace:^"
# `pnpm run` installs first by default, and under `turbo run clean` one
# package's install re-links the others while they are being deleted.
verifyDepsBeforeRun: false
allowBuilds:
  esbuild: true
# `bun-types` imports `undici-types` in its declarations without depending on
# it, so it resolved only while pnpm happened to hoist a copy. Declared here so
# the Bun example typechecks whatever else the workspace installs.
packageExtensions:
  bun-types:
    dependencies:
      undici-types: "^7.24.6"
