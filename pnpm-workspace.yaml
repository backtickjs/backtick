packages:
  # What is published: the packages, all at one version.
  - "packages/*"
  # The projects `create-backtick-app` copies, installed here so they're
  # checked against the packages beside them.
  - "packages/create-backtick-app/templates/*"
  # Complete apps that show Backtick with other libraries, checked the same
  # way.
  - "examples/*"
  # Built here and never published to npm: the website and the editor
  # extension.
  - "apps/*"
  # Each user's sandbox, which the service installs on its own.
  - "apps/mcp.backtickjs.com/sandbox"
  - "tests"
  # A stand-in third-party library the tests bind to.
  - "tests/fixtures/*"
  # test262, run as client scripts, and the js-framework-benchmark app: each
  # its own project, beside the tests.
  - "tests/conformance"
  - "tests/js-framework-benchmark"

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false # `pnpm add` writes "^2.16.9", not "workspace:^"
# `pnpm run` installs first by default, and under `turbo run clean` one
# package's install re-links the others while they are being deleted.
verifyDepsBeforeRun: false
allowBuilds:
  # Jest's file watcher, for `jest --watch`, which the shell's tests don't
  # use; its prebuilt binary comes as an optional package.
  "@parcel/watcher": false
  # Signs the VS Code extension when it's published to the Marketplace.
  "@vscode/vsce-sign": true
  esbuild: true
  # Stores Marketplace logins in the system keychain; publishing uses tokens
  # from the environment instead.
  keytar: false
  # Cloudflare's Workers runtime, which `wrangler dev` runs: its install
  # fetches the binary for this machine.
  workerd: true
# `bun-types` imports `undici-types` in its declarations without depending on
# it, so it resolved only while pnpm happened to hoist a copy. Declared here so
# what uses Bun's types (the site, the Bun plugin) typechecks whatever else the
# workspace installs.
packageExtensions:
  bun-types:
    dependencies:
      undici-types: "^7.24.6"
  # Its declarations add three.js's elements to React's JSX without depending
  # on React's types, so they went to whichever copy pnpm hoisted: since the
  # shell moved to @types/react 19.3.0, not the one Doom checks with. A peer,
  # so each project's own copy is the one they extend.
  "@react-three/fiber":
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
  # Its preset resolves react-native without depending on it, so the shell's
  # tests got whichever copy pnpm hoisted (0.86, from the tests' project).
  "@react-native/jest-preset":
    peerDependencies:
      react-native: "*"
# `expo-updates` has `expo-dev-client` as an optional peer, which pnpm installs
# anyway; prebuild then applies its plugin to the shell, which doesn't use it,
# adding the dev launcher's local network string to the store build.
overrides:
  "expo-updates>expo-dev-client": "-"
# pnpm holds back versions published within its minimum release age; ours
# are released from here, and the sandbox installs them from npm right after.
minimumReleaseAgeExclude:
  - "@backtickjs/*"
