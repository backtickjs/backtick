packages:
  # What is published: the packages, all at one version, and the adapters,
  # each at its framework's.
  - "packages/*"
  - "adapters/*"
  # The projects `create-backtick-app` copies, installed here so they're
  # checked against the packages beside them.
  - "packages/create-backtick-app/templates/*"
  # Complete apps that show Backtick with other libraries, checked the same
  # way.
  - "examples/*"
  # Built here and never published to npm: an editor extension and the
  # benchmark app.
  - "apps/*"
  - "tests"
  # A stand-in third-party library the tests bind to.
  - "tests/fixtures/*"

linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false # `pnpm add` writes "^2.16.9", not "workspace:^"
# `pnpm run` installs first by default, and under `turbo run clean` one
# package's install re-links the others while they are being deleted.
verifyDepsBeforeRun: false
allowBuilds:
  # Signs the VS Code extension when it's published to the Marketplace.
  "@vscode/vsce-sign": true
  esbuild: true
  # Stores Marketplace logins in the system keychain; publishing uses tokens
  # from the environment instead.
  keytar: false
# `bun-types` imports `undici-types` in its declarations without depending on
# it, so it resolved only while pnpm happened to hoist a copy. Declared here so
# what uses Bun's types (the site, the Bun plugin) typechecks whatever else the
# workspace installs.
packageExtensions:
  bun-types:
    dependencies:
      undici-types: "^7.24.6"
