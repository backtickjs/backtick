name: Apple sign-in secret

# Supabase signs in with Apple with a secret Apple lets last 6 months at most,
# and Supabase's API only takes a new one from a token that could also delete
# the project, so it's renewed by hand (apps/auth.backtickjs.com/scripts/
# appleSecret.ts). This fails from a month before it expires, and a failed run
# emails the repo's owner. After renewing, set the new date here.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

env:
  EXPIRES: "2027-05-02"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check it isn't about to expire
        run: |
          left=$(( ($(date -d "$EXPIRES" +%s) - $(date +%s)) / 86400 ))
          if [ "$left" -lt 30 ]; then
            echo "::error::Apple's sign-in secret expires on $EXPIRES, in $left days. Renew it with apps/auth.backtickjs.com/scripts/appleSecret.ts, then set EXPIRES in .github/workflows/apple-secret.yml."
            exit 1
          fi
          echo "Apple's sign-in secret is good until $EXPIRES ($left days)."
