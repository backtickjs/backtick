name: Apple sign-in secret

# Supabase signs in with Apple with a secret Apple lets last 6 months at
# most. Renewed monthly, each one good for 6 months: a failed run emails the
# repo's owner, months before sign-in would break.
on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/auth.backtickjs.com/scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Nothing to install: setup-node would otherwise cache with the
          # repo's package manager, pnpm, which this job doesn't set up.
          package-manager-cache: false
      - run: node apps/auth.backtickjs.com/scripts/appleSecret.ts
        env:
          APPLE_SIGN_IN_KEY: ${{ secrets.APPLE_SIGN_IN_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
