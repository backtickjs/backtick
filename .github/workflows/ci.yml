name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything `pnpm` checks locally: format, types, tests. On `main`, the
  # site's build is kept for the deploy below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The site and `@backtickjs/bun-plugin`'s tests run on Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/backtickjs.com/dist

  # backtickjs.com, published once `main` passes.
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
