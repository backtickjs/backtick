name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything `pnpm` checks locally: format, types, tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # `@backtickjs/bun-plugin`'s tests run on Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
